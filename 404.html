<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Grant Crowder</title>
    <link rel="icon" href="Images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Inter:wght@100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <meta name="robots" content="noindex">
</head>
<body class="bg-stone-50 font-inter antialiased min-h-screen flex flex-col">
    <div class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full text-center">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <img src="Images/gc-mark.svg" alt="Grant Crowder Logo" class="h-20 w-auto">
            </div>
            
            <!-- 404 Message -->
            <div class="mb-8">
                <h1 class="text-8xl font-bold text-gray-800 font-syne mb-4">404</h1>
                <h2 class="text-2xl font-semibold text-gray-900 font-syne mb-4">Page Not Found</h2>
                <p class="text-gray-600 text-lg leading-relaxed">
                    Sorry, the page you're looking for doesn't exist or has been moved.
                </p>
            </div>
            
            <!-- Action Buttons -->
            <div class="space-y-4">
                <div class="flex justify-center">
                    <primary-button onclick="window.location.href='/';" style="min-width: 200px;">
                        View My Work
                    </primary-button>
                </div>
                <div>
                    <a href="javascript:history.back()" class="text-gray-800 hover:text-coral-600 transition-colors font-medium">
                        ← Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2025 Grant Crowder. All rights reserved.</p>
    </footer>
    
    <!-- Load button component -->
    <script src="wc-button.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</body>
</html>
