<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Grant Crowder Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="Images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="dist/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex">
  <meta name="googlebot" content="noindex">
  <meta name="bingbot" content="noindex">
  <meta name="yandexbot" content="noindex">
  <meta name="duckduckbot" content="noindex">
  <meta name="baidu" content="noindex">
  <meta name="sogou" content="noindex">
  <meta name="360" content="noindex">
</head>
<body class="bg-gray-50 font-sans antialiased">
  <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
      <div>
        <h2 class="mt-6 text-center text-3xl font-bold text-gray-900 font-syne">
          Access Portfolio
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Enter your credentials to view the portfolio
        </p>
      </div>
      
      <form id="loginForm" class="mt-8 space-y-6">
        <div class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input 
              id="email" 
              name="email" 
              type="email" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
              placeholder="Enter your email"
            />
          </div>
          
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input 
              id="password" 
              name="password" 
              type="password" 
              required 
              class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" 
              placeholder="Enter your password"
            />
          </div>
        </div>

        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 rounded-md p-4">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-red-800" id="errorText"></h3>
            </div>
          </div>
        </div>

        <div id="loadingMessage" class="hidden bg-blue-50 border border-blue-200 rounded-md p-4">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-blue-800">Signing in...</h3>
            </div>
          </div>
        </div>

        <div>
          <button 
            type="submit" 
            id="loginButton"
            class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Sign In
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load Supabase from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script>
    // Supabase configuration
    const supabaseUrl = 'https://yjizrkagqyzftumbkdym.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqaXpya2FncXl6ZnR1bWJrZHltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM4MjA0MDksImV4cCI6MjA2OTM5NjQwOX0.BWX7ofphbS47z78OTxe3A0aySfzoAtYkSBExtKEEjgA';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const loadingMessage = document.getElementById('loadingMessage');
    const loginButton = document.getElementById('loginButton');

    // Check if user is already authenticated
    window.addEventListener('load', async () => {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          console.log('User already authenticated, redirecting...');
          window.location.href = '/';
        }
      } catch (error) {
        console.error('Error checking auth status:', error);
      }
    });

    // Handle form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Show loading state
      showLoading(true);
      hideError();

      try {
        console.log('Attempting to sign in...');
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });
        
        if (error) {
          throw error;
        }

        console.log('Sign in successful:', data);
        // Success - redirect to homepage
        window.location.href = '/';
        
      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || 'Login failed. Please try again.');
      } finally {
        showLoading(false);
      }
    });

    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }

    function showLoading(isLoading) {
      if (isLoading) {
        loadingMessage.classList.remove('hidden');
        loginButton.disabled = true;
        loginButton.textContent = 'Signing in...';
      } else {
        loadingMessage.classList.add('hidden');
        loginButton.disabled = false;
        loginButton.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
